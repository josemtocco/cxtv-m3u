name: Atualizar lista M3U CXTV Brasil

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "src/gerar_m3u.py"
      - "requirements.txt"
      - ".github/workflows/atualizar.yml"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Gerar lista M3U
        run: python src/gerar_m3u.py

      - name: Verificar lista
        run: |
          test -f listas/cxtv-brasil.m3u
          grep -q "^#EXTM3U" listas/cxtv-brasil.m3u
          test "$(grep -c '^#EXTINF' listas/cxtv-brasil.m3u)" -gt 0

      - name: Commit da lista atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listas/cxtv-brasil.m3u
          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "Atualizar lista CXTV Brasil"
            git push
          fi
